<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きこえる話し方コーチ</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#222;--sub:#6b6b6b;--ac:#2f7d6d;--ok:#2f9e5f;--warn:#e3a02b;--bad:#d25b5b;--ln:#e2ddd5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#222527;--tx:#eee;--sub:#9a9a9a;--ac:#5bbfa9;--ln:#383c3f}}
:root[data-theme="dark"]{--bg:#17191a;--card:#222527;--tx:#eee;--sub:#9a9a9a;--ac:#5bbfa9;--ln:#383c3f}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.45}
main{max-width:480px;margin:0 auto;height:100%;box-sizing:border-box;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 10px}
.cap{font-size:11px;color:var(--sub)}
#sim{font-size:22px;min-height:34px;letter-spacing:1px;word-break:break-all}
.earw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.earw svg{flex:1;min-height:0;max-width:100%}
#adv{font-size:17px;font-weight:700;text-align:center}
.goals{display:flex;flex-direction:column;gap:2px;font-size:13px}
.gr{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.gauge{position:relative;height:16px;border-radius:8px}
.mk{position:absolute;top:-4px;width:5px;height:24px;border-radius:3px;background:var(--tx);left:50%;transition:left .15s;box-shadow:0 0 0 2px var(--card)}
.lab{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);grid-column:2}
#stt{font-size:12px}
.menu{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);display:none}
.menu.open{display:block}
.menu>div{max-width:480px;margin:0 auto}
.menu h2{font-size:14px;color:var(--sub);margin:14px 0 6px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0}
.row b{width:54px}.row input{flex:1}.row span{width:52px;text-align:right}
.seg{display:flex;gap:6px}
</style>
</head>
<body>
<main>
 <div class="top"><h1>きこえる話し方コーチ</h1><button id="mb" aria-label="メニュー">☰ メニュー</button></div>

 <div class="box"><div class="cap">この耳にはこう聞こえるイメージ</div><div id="sim" class="cap">話しかけると、ここに出ます。かすんだ文字は聞こえにくい部分です。</div></div>

 <div class="earw">
  <svg viewBox="0 0 240 300" aria-label="耳">
   <g id="eg">
    <path d="M120 20C60 20 40 90 55 150C65 190 90 230 110 255C125 275 160 275 170 245C175 225 190 215 195 190C215 150 205 20 120 20Z" fill="#f0c9a8" stroke="#8a5a3a" stroke-width="7" id="shape"/>
    <path d="M120 62C88 62 82 112 98 150" fill="none" stroke="#8a5a3a" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 100C108 105 112 150 130 160C148 170 160 140 150 115" fill="none" stroke="#8a5a3a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="132" cy="150" rx="8" ry="12" fill="#6b3f26"/>
   </g>
  </svg>
  <div id="adv">画面をタップして開始</div>
 </div>

 <div class="box goals">
  <div class="cap">この方への話しかけ方(目標) <span id="deg"></span></div>
  <div id="g1"></div><div id="g2"></div><div id="g3"></div>
 </div>

 <div class="box">
  <div class="gr"><b>🔊 大きさ</b><div class="gauge" id="gv"><div class="mk" id="mv"></div></div><div class="lab"><span>小さい</span><span>ちょうど</span><span>大きすぎ</span></div></div>
  <div class="gr"><b>🐢 速さ</b><div class="gauge" id="gs"><div class="mk" id="ms"></div></div><div class="lab"><span>ゆっくり</span><span>ちょうど</span><span>速い</span></div></div>
  <div class="gr"><b>🗣️ 滑舌</b><div class="gauge" id="gc" style="background:linear-gradient(90deg,var(--bad),var(--warn) 50%,var(--ok) 80%)"><div class="mk" id="mc" style="left:0"></div></div><div class="lab"><span>不明瞭</span><span>まずまず</span><span>はっきり</span></div></div>
 </div>
</main>

<div class="menu" id="menu"><div>
 <button id="mx" style="width:100%">✕ とじる</button>
 <h2>耳の左右</h2>
 <div class="seg"><button id="bR" class="on">右耳</button><button id="bL">左耳</button></div>
 <h2>オージオグラム(聴力レベル dB)</h2>
 <div id="sl"></div>
 <svg id="chart" viewBox="0 0 300 160" width="100%"></svg>
 <h2>ふだんの声</h2>
 <button id="cal" style="width:100%">ふだんの声を登録しなおす(3秒話す)</button>
 <p class="cap">登録しないときは、最初に話した数秒を「ふだんの声」として自動で使います。</p>
</div></div>

<script>
const F=[250,500,1000,2000,4000,8000];
let th=[10,10,20,35,50,60],side='R',gain=0,tgtRate=7;
const $=id=>document.getElementById(id),avg=a=>a.reduce((x,y)=>x+y,0)/a.length,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
$('mb').onclick=()=>$('menu').classList.add('open');$('mx').onclick=()=>$('menu').classList.remove('open');
const sl=$('sl');
F.forEach((f,i)=>{const r=document.createElement('div');r.className='row';
 r.innerHTML='<b>'+(f>=1000?f/1000+'k':f)+' Hz</b><input type="range" min="0" max="100" step="5" value="'+th[i]+'"><span></span>';
 const inp=r.querySelector('input');inp.oninput=()=>{th[i]=+inp.value;upd()};sl.appendChild(r)});
$('bR').onclick=()=>setSide('R');$('bL').onclick=()=>setSide('L');
function setSide(s){side=s;$('bR').classList.toggle('on',s=='R');$('bL').classList.toggle('on',s=='L');
 $('eg').setAttribute('transform',s=='L'?'translate(240,0) scale(-1,1)':'');draw()}
function zoneBg(a,b,w){return 'linear-gradient(90deg,var(--bad) 0%,var(--warn) '+(a-w)+'%,var(--ok) '+a+'%,var(--ok) '+b+'%,var(--warn) '+(b+w)+'%,var(--bad) 100%)'}
function upd(){
 [...sl.querySelectorAll('span')].forEach((s,i)=>s.textContent=th[i]+' dB');
 const pta=avg(th.slice(1,5)),high=avg(th.slice(3)),low=avg(th.slice(0,3));
 $('deg').textContent='('+(pta<=25?'正常範囲':pta<=40?'軽度難聴':pta<=70?'中等度難聴':pta<=90?'高度難聴':'重度難聴')+')';
 $('shape').setAttribute('fill',pta<=25?'#f0c9a8':pta<=40?'#e8b98f':pta<=70?'#d99a7a':'#c27a6a');
 gain=cl((pta-20)*0.35,0,15);
 tgtRate=Math.max(3.5,7-(pta/100)*3-(high-low>20?0.5:0));
 $('g1').textContent='🔊 '+(gain<2?'ふだんどおりの声でOK':gain<6?'ふだんより少し大きめに':gain<11?'ふだんよりかなり大きめに':'近づいて、大きめにはっきり');
 $('g2').textContent='🐢 '+(tgtRate>=6?'ふつうの速さでOK':tgtRate>=5?'少しゆっくり':'かなりゆっくり、区切って');
 $('g3').textContent=high-low>=20?'👂 「さ・か・た・は行」をはっきり。声は低めに':low-high>=20?'👂 母音をしっかり、やや高めの声で':'👀 正面で口元を見せて、雑音を減らす';
 const vc=(gain+20)/40*100;$('gv').style.background=zoneBg(vc-8,vc+12,12);
 const sc=tgtRate/12*100;$('gs').style.background=zoneBg(sc-9,sc+9,14);
 draw()}
function draw(){
 const x=i=>40+i*45,y=d=>20+d*1.2;let s='';
 for(let d=0;d<=100;d+=20)s+='<line x1="30" x2="290" y1="'+y(d)+'" y2="'+y(d)+'" stroke="var(--ln)"/><text x="4" y="'+(y(d)+4)+'" font-size="9" fill="var(--sub)">'+d+'</text>';
 F.forEach((f,i)=>s+='<text x="'+(x(i)-8)+'" y="12" font-size="9" fill="var(--sub)">'+(f>=1000?f/1000+'k':f)+'</text>');
 const c=side=='R'?'#d9534f':'#3b7ddd';
 s+='<polyline fill="none" stroke="'+c+'" stroke-width="2" points="'+th.map((d,i)=>x(i)+','+y(d)).join(' ')+'"/>';
 th.forEach((d,i)=>s+=side=='R'?'<circle cx="'+x(i)+'" cy="'+y(d)+'" r="5" fill="none" stroke="'+c+'" stroke-width="2"/>':'<path d="M'+(x(i)-4)+' '+(y(d)-4)+'l8 8m0-8l-8 8" stroke="'+c+'" stroke-width="2"/>');
 $('chart').innerHTML=s}
const HF='さしすせそかきくけこたちつてとはひふへほぱぴぷぺぽサシスセソカキクケコタチツテトハヒフヘホ';
let ctx,an,buf,base=null,calVals=[],calFrames=0,calUntil=0,rec=null,running=false,uStart=0,uLen=0,dbs=[],lastTxt='',rate=0,starting=false;
async function mic(){
 if(an)return true;
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=1024;
  ctx.createMediaStreamSource(st).connect(an);buf=new Float32Array(an.fftSize);loop();return true}
 catch(e){$('adv').textContent='マイクを許可してください(タップで再試行)';return false}}
function resetCal(sec){base=null;calVals=[];calFrames=0;calUntil=sec?performance.now()+sec*1000:0}
$('cal').onclick=async()=>{if(await mic()){resetCal(3);$('menu').classList.remove('open');$('adv').textContent='いつもの声で話してください…'}};
function loop(){
 an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length)||1e-6;
 const now=performance.now(),voiced=rms>(base?base*0.25:0.01);
 if(!base){
  if(voiced){calVals.push(rms);calFrames++}
  const done=calUntil?now>calUntil:calFrames>=90;
  if(done&&calVals.length>5){base=avg(calVals);calVals=[];calUntil=0;$('adv').textContent='準備OK。話しかけてください'}
  else if(!done&&running)$('adv').textContent='ふだんの声で話してください…'}
 else if(running&&voiced){const db=20*Math.log10(rms/base);dbs.push(db);if(dbs.length>40)dbs.shift();
  $('mv').style.left=cl((avg(dbs)+20)/40*100,0,100)+'%';render()}
 if(running&&uStart&&uLen>2){rate=uLen/Math.max(1,(now-uStart)/1000);$('ms').style.left=cl(rate/12*100,0,100)+'%'}
 requestAnimationFrame(loop)}
function judge(){
 if(!base||!dbs.length)return;
 const m=avg(dbs),r=rate||tgtRate,quiet=m<gain-3,loud=m>gain+5,fast=r>tgtRate+1.3,slow=r<tgtRate-1.3;
 if(!quiet&&!loud&&!fast&&!slow){$('adv').textContent='👂 この耳にしっかり届いています';$('shape').setAttribute('stroke','var(--ok)')}
 else{const p=[];if(quiet)p.push('もう少し大きく');if(loud)p.push('大きすぎ。近づいて');if(fast)p.push('もっとゆっくり');if(slow)p.push('少し速く');
  $('adv').textContent='🙉 '+p.join('・');$('shape').setAttribute('stroke','var(--warn)')}}
function render(){
 if(!lastTxt)return;
 const m=dbs.length?avg(dbs):0,q=m<gain-3?cl(1-(gain-3-m)/15,0.3,1):1,hfl=cl((avg(th.slice(3,5))-20)/60,0,1)*0.75;
 $('sim').className='';
 $('sim').innerHTML=[...lastTxt].map(ch=>{const o=q*(HF.includes(ch)?1-hfl:1);
  return '<span style="opacity:'+o.toFixed(2)+';filter:blur('+((1-o)*3).toFixed(1)+'px)">'+ch+'</span>'}).join('');
 judge()}
async function start(){
 if(running||starting)return;starting=true;
 if(!await mic()){starting=false;return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 running=true;starting=false;$('adv').textContent=base?'話しかけてください':'ふだんの声で話してください…';
 if(!SR){$('sim').textContent='この端末は音声認識に未対応です(大きさのみ表示)';return}
 rec=new SR();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{let t='',cf=[];for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal&&e.results[i][0].confidence>0)cf.push(e.results[i][0].confidence)}
  lastTxt=t.replace(/\s/g,'').slice(-40);if(!uStart){uStart=performance.now();dbs=[]}uLen=lastTxt.length;
  if(cf.length){const c=avg(cf);$('mc').style.left=cl(c*100,0,100)+'%'}
  render();
  if(e.results[e.results.length-1].isFinal)setTimeout(()=>{uStart=0;uLen=0},800)};
 rec.onend=()=>{if(running){try{rec.start()}catch(e){}}};
 rec.onstart=()=>{if(!lastTxt)$('sim').textContent='🎙 聞き取り中…'};
 rec.onerror=ev=>{const m={'not-allowed':'音声認識が許可されていません(この画面では使えない可能性。ブラウザで開いてください)','service-not-allowed':'この環境では音声認識が使えません。ブラウザで開いてください','audio-capture':'音声認識がマイクを使えません(声の測定と競合している可能性)','network':'音声認識のネットワークエラー','language-not-supported':'日本語の音声認識に未対応です'}[ev.error];
  if(m){$('sim').className='cap';$('sim').textContent='⚠ '+m+' ['+ev.error+']';if(ev.error=='not-allowed'||ev.error=='service-not-allowed'){running=false}}};
 try{rec.start()}catch(e){}}
document.addEventListener('pointerdown',()=>{if(!running)start()});
upd();start();
</script>
</body>
</html>
