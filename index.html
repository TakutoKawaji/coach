<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聞きやすい話し方コーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121218;
    --panel: #1a1a22;
    --outline: #f5f5f2;
    --accent: #5ac8ff;
    --accent-dim: #3a7ea6;
    --ink-soft: #9a9aa6;
    --ink-faint: #6d6d78;
    --warn: #ffdc78;
    --danger: #ff6b6b;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--outline);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  header {
    width: 100%;
    max-width: 920px;
    padding: 28px 20px 8px;
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }
  main {
    width: 100%;
    max-width: 920px;
    padding: 12px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }
  .phrase-row {
    width: 100%;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .phrase-row input[type="text"] {
    flex: 1 1 260px;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid #2c2c36;
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--outline);
    font-size: 16px;
    font-family: inherit;
  }
  .phrase-row button {
    background: #23232c;
    border: 1px solid #34343f;
    color: var(--outline);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .phrase-row button:hover { border-color: var(--accent-dim); }

  .stage {
    width: 100%;
    background: radial-gradient(ellipse at 50% 0%, #17171f 0%, var(--bg) 70%);
    border: 1px solid #23232c;
    border-radius: 18px;
    padding: 36px 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: 260px;
    overflow-x: auto;
  }
  #canvasWrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100%;
  }
  .status-line {
    min-height: 20px;
    font-size: 13px;
    color: var(--warn);
    text-align: center;
  }
  .result-line {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.7;
  }
  .legend {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.8;
  }

  .btn-wrap {
    display: flex;
    justify-content: center;
    margin-top: 4px;
  }
  #recBtn {
    width: 200px;
    height: 64px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, #3f8fd6, #2c6fae);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.08s ease, background 0.15s ease;
    box-shadow: 0 6px 18px rgba(58, 126, 166, 0.35);
  }
  #recBtn:active { transform: scale(0.97); }
  #recBtn.recording {
    background: linear-gradient(180deg, #e05656, #b83a3a);
    box-shadow: 0 6px 18px rgba(184, 58, 58, 0.4);
  }
  #recBtn.busy {
    background: #2a2a33;
    color: var(--ink-soft);
    cursor: default;
    box-shadow: none;
  }
  #recBtn.disabled {
    background: #26262f;
    color: var(--ink-faint);
    cursor: not-allowed;
    box-shadow: none;
  }

  .compat-note {
    max-width: 560px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    padding: 0 12px;
  }
  .compat-note b { color: var(--ink-soft); }

  footer {
    padding: 10px 16px 30px;
    font-size: 11px;
    color: #4a4a54;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>聞きやすい話し方コーチ</h1>
  <p class="sub">白いお手本の文字の上に、実際に聞こえた声の特徴を重ねて表示します</p>
</header>

<main>
  <div class="phrase-row">
    <input id="phraseInput" type="text" value="おとうさん" maxlength="20" placeholder="練習したいセリフを入力">
    <button id="setPhraseBtn">このセリフで練習</button>
  </div>

  <div class="stage">
    <div id="canvasWrap"><canvas id="stageCanvas"></canvas></div>
    <div class="status-line" id="statusLine"></div>
    <div class="result-line" id="resultLine"></div>
    <div class="legend">
      文字が太い = 声が大きい　文字が大きい = 話すのが速い<br>
      文字が薄い = 聞き取りにくい　文字が上にずれる = 抑揚が高い
    </div>
  </div>

  <div class="btn-wrap">
    <button id="recBtn">押しながら発話</button>
  </div>

  <p class="compat-note">
    マイクの使用許可が必要です。音声認識には <b>Chrome / Edge（PC・Android）</b> を推奨します。
    Safari など認識に非対応のブラウザでは、音量・速さ・抑揚の解析のみ行われ、文字は入力欄のセリフとして表示されます。
    かな（ひらがな・カタカナ）のセリフで練習すると、モーラ分割の精度が最も高くなります。
  </p>
</main>

<footer>聞きやすい話し方コーチ — ブラウザ版プロトタイプ</footer>

<script>
"use strict";

/* ============================================================
   設定
============================================================ */
const SMALL_KANA = new Set("ゃゅょぁぃぅぇぉャュョァィゥェォ".split(""));

const BASE_FONT_SIZE = 56;
const OUTLINE_COLOR = "#f5f5f2";
const USER_COLOR = [90, 200, 255];
const BG_COLOR = "#121218";

// 音量→太さ: 声の大きさにそのまま比例して文字の太さが変わる
const BOLD_MIN = 0.6, BOLD_MAX = 24;
const SCALE_MIN = 0.65, SCALE_MAX = 1.6;
const ALPHA_MIN = 0.28, ALPHA_MAX = 1.0;
const YSHIFT_MAX = 34;

let targetPhrase = "おとうさん";
let targetMora = splitMora(targetPhrase);

/* ============================================================
   モーラ分割
============================================================ */
function splitMora(text) {
  const mora = [];
  let i = 0;
  const chars = Array.from(text);
  while (i < chars.length) {
    const c = chars[i];
    if (i + 1 < chars.length && SMALL_KANA.has(chars[i + 1])) {
      mora.push(c + chars[i + 1]);
      i += 2;
    } else {
      mora.push(c);
      i += 1;
    }
  }
  return mora;
}

/* かな以外(漢字など)を含むかどうか判定して、簡易ふりがな変換の要否を決める */
function isKanaOnly(text) {
  return /^[\u3040-\u309F\u30A0-\u30FFー。、\s]*$/.test(text);
}

/* ============================================================
   簡易 SequenceMatcher 風の一致度(difflib.ratio相当の近似)
============================================================ */
function matchRatio(a, b) {
  if (a.length === 0 && b.length === 0) return 1;
  const lcs = lcsLength(a, b);
  return (2 * lcs) / (a.length + b.length);
}
function lcsLength(a, b) {
  const n = a.length, m = b.length;
  const dp = new Array(m + 1).fill(0);
  for (let i = 1; i <= n; i++) {
    let prev = 0;
    for (let j = 1; j <= m; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev + 1 : Math.max(dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[m];
}

/* ============================================================
   かな変換 (外部辞書なしの軽量版)
   ひらがな・カタカナのみの発話はそのままモーラ分割できる。
   漢字が混じる場合、ブラウザだけで正確な読みを求めるには重い形態素解析
   辞書が必要になり読み込みに時間がかかるため、この軽量版では簡易的に
   「1文字 = 1モーラ」として扱う(プロトタイプゆえの簡略化)。
============================================================ */
function katakanaToHiragana(str) {
  return str.replace(/[\u30A1-\u30F6]/g, (ch) =>
    String.fromCharCode(ch.charCodeAt(0) - 0x60)
  );
}

function toHiragana(text) {
  if (!text) return "";
  if (isKanaOnly(text)) return katakanaToHiragana(text);
  // 漢字混じりの場合はそのまま返す(呼び出し側で1文字=1モーラとして扱われる)
  return text;
}

/* ============================================================
   録音 (Web Audio API で PCM を保持)
============================================================ */
class Recorder {
  constructor() {
    this.audioCtx = null;
    this.stream = null;
    this.processor = null;
    this.source = null;
    this.buffers = [];
    this.sampleRate = 44100;
  }
  async start() {
    this.buffers = [];
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    this.sampleRate = this.audioCtx.sampleRate;
    this.source = this.audioCtx.createMediaStreamSource(this.stream);
    const bufferSize = 4096;
    this.processor = this.audioCtx.createScriptProcessor(bufferSize, 1, 1);
    this.processor.onaudioprocess = (e) => {
      const data = e.inputBuffer.getChannelData(0);
      this.buffers.push(new Float32Array(data));
    };
    this.source.connect(this.processor);
    this.processor.connect(this.audioCtx.destination);
  }
  stop() {
    if (this.processor) { this.processor.disconnect(); this.processor.onaudioprocess = null; }
    if (this.source) this.source.disconnect();
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    if (this.audioCtx) this.audioCtx.close();
    let total = 0;
    for (const b of this.buffers) total += b.length;
    const out = new Float32Array(total);
    let off = 0;
    for (const b of this.buffers) { out.set(b, off); off += b.length; }
    return { samples: out, sampleRate: this.sampleRate };
  }
}

/* ============================================================
   音声認識 (Web Speech API)
============================================================ */
function createRecognizer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = "ja-JP";
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  return rec;
}

/* ============================================================
   信号処理: RMS / 無音トリム / ピッチ(自己相関) / スペクトル平坦度(FFT)
============================================================ */
function rms(buf) {
  if (buf.length === 0) return 0;
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}

function frameRmsEnvelope(samples, sr, frameMs = 20) {
  const frameLen = Math.max(1, Math.floor((sr * frameMs) / 1000));
  const frames = [];
  for (let i = 0; i < samples.length; i += frameLen) {
    frames.push(rms(samples.subarray(i, Math.min(i + frameLen, samples.length))));
  }
  return { frames, frameLen };
}

function trimSilence(samples, sr) {
  if (samples.length === 0) return [0, 0];
  const { frames, frameLen } = frameRmsEnvelope(samples, sr);
  const maxRms = Math.max(...frames, 1e-6);
  const threshold = maxRms * 0.12;
  let startFrame = frames.findIndex((v) => v > threshold);
  let endFrame = frames.length - 1;
  for (let i = frames.length - 1; i >= 0; i--) {
    if (frames[i] > threshold) { endFrame = i; break; }
  }
  if (startFrame === -1) return [0, samples.length];
  const start = startFrame * frameLen;
  const end = Math.min(samples.length, (endFrame + 1) * frameLen);
  return [start, Math.max(end, start + 1)];
}

// 自己相関法による基本周波数(F0)推定。70Hz〜500Hzの範囲を探索
function estimatePitch(segment, sr) {
  const n = segment.length;
  if (n < 64) return 0;
  const minLag = Math.floor(sr / 500);
  const maxLag = Math.min(Math.floor(sr / 70), n - 1);
  if (maxLag <= minLag) return 0;

  // 簡易な無声/無音判定
  const energy = rms(segment);
  if (energy < 0.003) return 0;

  let bestLag = -1;
  let bestCorr = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let corr = 0, norm1 = 0, norm2 = 0;
    for (let i = 0; i + lag < n; i++) {
      corr += segment[i] * segment[i + lag];
      norm1 += segment[i] * segment[i];
      norm2 += segment[i + lag] * segment[i + lag];
    }
    const denom = Math.sqrt(norm1 * norm2) || 1e-9;
    const normCorr = corr / denom;
    if (normCorr > bestCorr) { bestCorr = normCorr; bestLag = lag; }
  }
  if (bestLag <= 0 || bestCorr < 0.35) return 0;
  return sr / bestLag;
}

// 反復FFT(Cooley-Tukey, radix-2)。長さは2の累乗にゼロ埋めする
function fft(re, im) {
  const n = re.length;
  if (n <= 1) return;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curWr = 1, curWi = 0;
      for (let j = 0; j < len / 2; j++) {
        const ur = re[i + j], ui = im[i + j];
        const vr = re[i + j + len / 2] * curWr - im[i + j + len / 2] * curWi;
        const vi = re[i + j + len / 2] * curWi + im[i + j + len / 2] * curWr;
        re[i + j] = ur + vr; im[i + j] = ui + vi;
        re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
        const nWr = curWr * wr - curWi * wi;
        const nWi = curWr * wi + curWi * wr;
        curWr = nWr; curWi = nWi;
      }
    }
  }
}

function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

// スペクトル平坦度 = 幾何平均 / 算術平均 (1に近いほどノイズ的=不明瞭、0に近いほど明瞭)
function spectralFlatness(segment) {
  if (segment.length < 32) return 1.0;
  const n = nextPow2(Math.min(segment.length, 1024));
  const re = new Float64Array(n);
  const im = new Float64Array(n);
  const len = Math.min(segment.length, n);
  for (let i = 0; i < len; i++) {
    // ハン窓
    const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (len - 1 || 1));
    re[i] = segment[i] * w;
  }
  fft(re, im);
  const half = n / 2;
  let logSum = 0, sum = 0, count = 0;
  for (let k = 1; k < half; k++) {
    const mag = Math.sqrt(re[k] * re[k] + im[k] * im[k]) + 1e-9;
    logSum += Math.log(mag);
    sum += mag;
    count++;
  }
  if (count === 0) return 1.0;
  const geoMean = Math.exp(logSum / count);
  const arithMean = sum / count;
  return arithMean > 0 ? geoMean / arithMean : 1.0;
}

/* ============================================================
   モーラ単位の特徴量計算 + 正規化
============================================================ */
function analyze(samples, sr, nMora) {
  let [start, end] = trimSilence(samples, sr);
  if (nMora === 0 || end - start < sr * 0.05) { start = 0; end = samples.length; }
  const voiced = samples.subarray(start, end);
  if (voiced.length < 10 || nMora === 0) return [];

  const segLen = Math.max(1, Math.floor(voiced.length / nMora));
  const results = [];
  for (let i = 0; i < nMora; i++) {
    const s = i * segLen;
    const e = i === nMora - 1 ? voiced.length : (i + 1) * segLen;
    const seg = voiced.subarray(s, e);
    const dur = (e - s) / sr;
    results.push({
      rms: rms(seg),
      dur,
      flatness: spectralFlatness(seg),
      f0: estimatePitch(seg, sr),
    });
  }
  return results;
}

function normalizeFeatures(features) {
  if (!features.length) return [];
  const rmsVals = features.map((f) => f.rms);
  const durVals = features.map((f) => f.dur).filter((d) => d > 0);
  const flatVals = features.map((f) => f.flatness);
  const f0Vals = features.map((f) => f.f0).filter((v) => v > 0);

  const maxRms = Math.max(...rmsVals, 1e-6);
  const avgDur = durVals.length ? durVals.reduce((a, b) => a + b, 0) / durVals.length : 0.2;
  let minFlat = Math.min(...flatVals, 1);
  let maxFlat = Math.max(...flatVals, 0);
  if (maxFlat - minFlat < 1e-6) maxFlat = minFlat + 1e-6;
  const meanF0 = f0Vals.length ? f0Vals.reduce((a, b) => a + b, 0) / f0Vals.length : 0;
  const maxF0Dev = f0Vals.length ? Math.max(...f0Vals.map((v) => Math.abs(v - meanF0)), 1) : 1;

  return features.map((f) => {
    const volume = maxRms > 0 ? f.rms / maxRms : 0;
    let speed = f.dur > 0 ? avgDur / f.dur : 1;
    speed = Math.min(Math.max(speed, 0.5), 2.0);
    let clarity = 1 - (f.flatness - minFlat) / (maxFlat - minFlat);
    clarity = Math.min(Math.max(clarity, 0), 1);
    let pitch = f.f0 > 0 && meanF0 > 0 ? (f.f0 - meanF0) / maxF0Dev : 0;
    pitch = Math.min(Math.max(pitch, -1), 1);
    return { volume, speed, clarity, pitch };
  });
}

/* ============================================================
   描画 (Canvas)
============================================================ */
const canvas = document.getElementById("stageCanvas");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function fittedCanvasWidth() {
  const wrap = document.getElementById("canvasWrap").parentElement;
  return Math.max(320, Math.min(860, wrap.clientWidth - 24));
}

function setupCanvas() {
  const w = fittedCanvasWidth();
  const h = 220;
  canvas.width = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

let lastRecognizedMora = [];
let lastNormFeatures = [];

function drawOutlineRow(moraList, yCenter, width) {
  ctx.font = `900 ${BASE_FONT_SIZE}px "Noto Sans JP", sans-serif`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  const widths = moraList.map((c) => ctx.measureText(c).width);
  const gap = 10;
  const totalW = widths.reduce((a, b) => a + b, 0) + gap * Math.max(0, widths.length - 1);
  let x = width / 2 - totalW / 2;
  ctx.lineJoin = "round";
  for (let i = 0; i < moraList.length; i++) {
    const c = moraList[i];
    const w = widths[i];
    ctx.lineWidth = 6;
    ctx.strokeStyle = OUTLINE_COLOR;
    ctx.strokeText(c, x + w / 2, yCenter);
    ctx.fillStyle = BG_COLOR;
    ctx.fillText(c, x + w / 2, yCenter);
    x += w + gap;
  }
  ctx.textAlign = "start";
}

function drawStyledRow(moraList, styles, yCenter, width) {
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.lineJoin = "round";

  // まず幅を仮測定(スケール反映後のフォントで)
  const metrics = moraList.map((ch, i) => {
    const st = styles[i] || { speed: 1, volume: 0, clarity: 1, pitch: 0 };
    const scale = SCALE_MIN + (SCALE_MAX - SCALE_MIN) * Math.min(Math.max((st.speed - 0.5) / 1.5, 0), 1);
    const size = Math.max(10, Math.round(BASE_FONT_SIZE * scale));
    ctx.font = `700 ${size}px "Noto Sans JP", sans-serif`;
    const w = ctx.measureText(ch).width;
    return { size, w, st };
  });

  const gap = 14;
  const totalW = metrics.reduce((a, m) => a + m.w, 0) + gap * Math.max(0, metrics.length - 1);
  let x = width / 2 - totalW / 2;

  for (let i = 0; i < moraList.length; i++) {
    const ch = moraList[i];
    const { size, w, st } = metrics[i];
    const boldN = (BOLD_MIN + (BOLD_MAX - BOLD_MIN) * st.volume) * (size / BASE_FONT_SIZE);
    const alpha = ALPHA_MIN + (ALPHA_MAX - ALPHA_MIN) * st.clarity;
    const yShift = -st.pitch * YSHIFT_MAX;

    ctx.font = `700 ${size}px "Noto Sans JP", sans-serif`;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = `rgb(${USER_COLOR.join(",")})`;
    ctx.fillStyle = `rgb(${USER_COLOR.join(",")})`;
    ctx.lineWidth = boldN;
    const cx = x + w / 2;
    const cy = yCenter + yShift;
    ctx.strokeText(ch, cx, cy);
    ctx.fillText(ch, cx, cy);
    ctx.globalAlpha = 1;
    x += w + gap;
  }
}

function render() {
  const width = canvas.width / DPR;
  const height = canvas.height / DPR;
  ctx.clearRect(0, 0, width, height);
  const outlineY = height / 2 - 10;
  drawOutlineRow(targetMora, outlineY, width);
  if (lastRecognizedMora.length) {
    drawStyledRow(lastRecognizedMora, lastNormFeatures, outlineY, width);
  }
}

window.addEventListener("resize", () => { setupCanvas(); render(); });

/* ============================================================
   アプリ本体
============================================================ */
const recBtn = document.getElementById("recBtn");
const statusLine = document.getElementById("statusLine");
const resultLine = document.getElementById("resultLine");
const phraseInput = document.getElementById("phraseInput");
const setPhraseBtn = document.getElementById("setPhraseBtn");

let recorder = null;
let recognizer = null;
let isRecording = false;
let isBusy = false;
let recognizedText = "";
let recognitionDone = false;
let recognitionResultPromiseResolve = null;

const hasSpeechRecognition = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

setPhraseBtn.addEventListener("click", () => {
  const v = phraseInput.value.trim();
  if (!v) return;
  targetPhrase = v;
  targetMora = splitMora(targetPhrase);
  lastRecognizedMora = [];
  lastNormFeatures = [];
  resultLine.textContent = "";
  statusLine.textContent = "";
  setupCanvas();
  render();
});

async function beginRecording() {
  if (isRecording || isBusy) return;
  statusLine.textContent = "";
  resultLine.textContent = "";
  try {
    recorder = new Recorder();
    await recorder.start();
  } catch (err) {
    statusLine.textContent = "マイクを使用できませんでした。ブラウザの権限設定を確認してください。";
    console.error(err);
    return;
  }

  recognizedText = "";
  recognitionDone = !hasSpeechRecognition;
  if (hasSpeechRecognition) {
    recognizer = createRecognizer();
    recognizer.onresult = (e) => {
      if (e.results && e.results[0] && e.results[0][0]) {
        recognizedText = e.results[0][0].transcript;
      }
    };
    recognizer.onerror = () => { recognitionDone = true; };
    recognizer.onend = () => {
      recognitionDone = true;
      if (recognitionResultPromiseResolve) { recognitionResultPromiseResolve(); recognitionResultPromiseResolve = null; }
    };
    try { recognizer.start(); } catch (e) { recognitionDone = true; }
  }

  isRecording = true;
  recBtn.textContent = "● 録音中 (離して終了)";
  recBtn.classList.add("recording");
}

async function endRecordingAndAnalyze() {
  if (!isRecording) return;
  isRecording = false;
  isBusy = true;
  recBtn.classList.remove("recording");
  recBtn.classList.add("busy");
  recBtn.textContent = "解析中...";
  statusLine.textContent = "解析中...(認識→特徴量計算)";

  const { samples, sampleRate } = recorder.stop();

  if (hasSpeechRecognition && recognizer) {
    try { recognizer.stop(); } catch (e) {}
    if (!recognitionDone) {
      await new Promise((resolve) => {
        recognitionResultPromiseResolve = resolve;
        setTimeout(resolve, 2500); // 認識が長引いた場合のフォールバック
      });
    }
  }

  const rawText = recognizedText || (hasSpeechRecognition ? "" : targetPhrase);
  const hira = toHiragana(rawText || "");
  const recMora = hira ? splitMora(hira) : [];

  let feats, norm, ratio;
  if (recMora.length > 0) {
    feats = analyze(samples, sampleRate, recMora.length);
    norm = normalizeFeatures(feats);
    ratio = matchRatio(targetMora, recMora);
  } else {
    // 認識できなかった場合でも、お手本のモーラ数で解析だけは行う
    const fallbackMora = targetMora;
    feats = analyze(samples, sampleRate, fallbackMora.length);
    norm = normalizeFeatures(feats);
    lastRecognizedMora = fallbackMora;
    lastNormFeatures = norm;
    statusLine.textContent = "";
    resultLine.textContent = hasSpeechRecognition
      ? "音声を認識できませんでした(無音・雑音の可能性)。お手本の文字数で解析結果のみ表示しています。"
      : "このブラウザは音声認識に対応していません。お手本の文字数で解析結果のみ表示しています。";
    render();
    finishBusy();
    return;
  }

  lastRecognizedMora = recMora;
  lastNormFeatures = norm;
  statusLine.textContent = "";
  resultLine.textContent = `認識結果: 「${rawText}」　一致度目安: ${Math.round(ratio * 100)}%`;
  render();
  finishBusy();
}

function finishBusy() {
  isBusy = false;
  recBtn.classList.remove("busy");
  recBtn.textContent = "もう一度録音";
}

// マウス操作
recBtn.addEventListener("mousedown", (e) => { e.preventDefault(); beginRecording(); });
window.addEventListener("mouseup", () => { if (isRecording) endRecordingAndAnalyze(); });

// タッチ操作(スマートフォン)
recBtn.addEventListener("touchstart", (e) => { e.preventDefault(); beginRecording(); }, { passive: false });
window.addEventListener("touchend", () => { if (isRecording) endRecordingAndAnalyze(); });
window.addEventListener("touchcancel", () => { if (isRecording) endRecordingAndAnalyze(); });

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  recBtn.classList.add("disabled");
  recBtn.textContent = "マイク非対応";
  statusLine.textContent = "このブラウザ・環境ではマイク録音がサポートされていません。";
}

/* 初期化 */
setupCanvas();
render();
</script>
</body>
</html>
